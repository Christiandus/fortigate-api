[tool.poetry]
name = "fortigate_api"
version = "2.0.8"
description = "Python package to configure Fortigate (Fortios) devices using REST API and SSH"
authors = ["Vladimirs Prusakovs <vladimir.prusakovs@gmail.com>"]
readme = "README.rst"
package-mode = true
requires-poetry = "2.1.2"
license = "Apache-2.0"
homepage = "https://github.com/vladimirs-git/fortigate-api"
repository = "https://github.com/vladimirs-git/fortigate-api"
keywords = ["fortigate", "fortios", "rest", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    # "Operating System :: FortiOS",
    "Topic :: System :: Networking :: Firewalls",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
]

[tool.poetry.urls]
homepage = "https://fortigate-api.readthedocs.io"
repository = "https://github.com/vladimirs-git/fortigate-api"
"Bug Tracker" = "https://github.com/vladimirs-git/fortigate-api/issues"

[tool.poetry.dependencies]
python = "^3.8"
#
requests = ">=2.34.1"
vhelpers = ">=0.8.0"

[tool.poetry.group.test.dependencies]
dictdiffer = "^0.9.0"
pytest = "^9.0.3"
pytest-mock = "^3.15.1"
requests-mock = "^1.12.1"

[tool.poetry.group.docs.dependencies]
jinja2 = "^3.1.6"
readthedocs-sphinx-search = "^0.3.2"
sphinx = "^9.1.0"
sphinx-rtd-theme = "^3.1.0"
sphinxcontrib-httpdomain = "^2.0.0"
sphinxcontrib-openapi = "^0.9.0"
tabulate = "^0.10.0"

[tool.poetry.group.dev.dependencies]
mypy = "^2.1.0"
pydantic = "^2.13.4"  # tools
pydocstyle = "^6.3.0"
pygments = "^2.20.0"  # rst-lint
pylint = "^4.0.5"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
restructuredtext-lint = "^2.0.2"
ruff = "^0.15.12"
twine = "^6.2.0"
types-requests = "^2.33.0.20260513"
types-tabulate = "^0.10.0.20260508"
typing-extensions = "^4.15.0"

[tool.pylint]
max-line-length = 100
disable = "fixme"

[tool.pylint.message_control]
enable = ["too-many-arguments"]
max-args = 13

[tool.pylint."fortigate_api.*"]
disable = [
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-statements",
]
[tool.pylint."fortigate_api.cmdb.cmdb_s.py"]
disable = [
    "line-too-long",
]
[tool.pylint."tests.*"]
disable = [
    "duplicate-code",
    "protected-access",
    "redefined-outer-name",
    "redefined-builtin",
    "unused-import",
    "use-dict-literal",
]

[tool.mypy]
python_version = "3.11"

[tool.ruff]
exclude = [
    ".git",
    ".idea",
    ".mypy_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "_notes",
    "dist",
    "examples",
    "notes",
    "sdist",
    "temp",
    "tests",
    "tmp",
    "venv",
]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F401", # imported but unused
    "F811", # Redefinition of unused
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # arguments on separate lines
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "pep257"  # docstring style

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
